<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<head>
    <title>Пошук людини</title>
</head>

<body>

    <h1>Пошук людини по ID</h1>

    <form action="/search" method="get">

        <input class="form-control" type="number" name="person_id" placeholder="Введіть ID" required>

        <button class="btn btn-primary" type="submit">
            Знайти
        </button>

    </form>

    <hr>

    {% if person %}

    <h2>{{ person.pib }}</h2>

    <p>Звання: {{ person.rank }}</p>

    <p>Посада: {{ person.position }}</p>

    <p>Телефон: {{ person.phone }}</p>

    <p>Статус: {{ person.status }}</p>

    {% endif %}

</body>

</html>
