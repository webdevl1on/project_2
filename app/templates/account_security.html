<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Безпека облікового запису</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">{% include 'components/security_session.html' %}</head><body class="container py-3">{% include 'components/app_navigation.html' %}<main data-mfa-mode="security"><h1 class="h3">Безпека облікового запису</h1><p>Критичні дії потребують підтвердження MFA за останні 5 хвилин.</p><form data-reauth><label>Поточний пароль<input type="password" name="password" autocomplete="current-password" class="form-control" required></label><button class="btn btn-primary my-2">Повторно підтвердити особу</button></form><p data-security-summary></p><button data-add-factor class="btn btn-primary">Додати фактор</button><button data-remove-totp class="btn btn-outline-danger" hidden>Видалити TOTP</button><ul data-passkeys class="list-group my-3"></ul><button data-backup-generate class="btn btn-outline-warning">Створити нові резервні коди</button><section data-codes hidden><pre data-code-list></pre><button data-copy-codes>Копіювати коди</button><button data-download-codes>Завантажити коди</button></section></main><p data-mfa-error class="alert alert-danger" hidden role="alert"></p><script src="/static/js/security_mfa.js"></script></body></html>
