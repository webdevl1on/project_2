<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>{{ page_title or "Форма людини" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">
    <h1 class="h2 mb-4">{{ page_title or "Додати людину" }}</h1>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ form_action or '/persons/new' }}" class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="surname">Прізвище *</label>
            <input class="form-control" id="surname" name="surname" required
                value="{{ form_data.get('surname', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="name">Ім'я *</label>
            <input class="form-control" id="name" name="name" required
                value="{{ form_data.get('name', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="patronymic">По батькові</label>
            <input class="form-control" id="patronymic" name="patronymic"
                value="{{ form_data.get('patronymic', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="tax_number">ІПН</label>
            <input class="form-control" id="tax_number" name="tax_number" inputmode="numeric"
                value="{{ form_data.get('tax_number', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="birth_date">Дата народження (ДД.ММ.РРРР)</label>
            <input class="form-control" id="birth_date" name="birth_date" placeholder="01.12.1990"
                value="{{ form_data.get('birth_date', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="rank">Звання</label>
            <input class="form-control" id="rank" name="rank" value="{{ form_data.get('rank', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="rank_order_number">Номер наказу на присвоєння звання</label>
            <input class="form-control" id="rank_order_number" name="rank_order_number"
                value="{{ form_data.get('rank_order_number', '') }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="rank_order_date">Дата наказу на присвоєння звання</label>
            <input class="form-control" id="rank_order_date" name="rank_order_date"
                value="{{ form_data.get('rank_order_date', '') }}">
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">{{ submit_label or "Зберегти" }}</button>
            <a class="btn btn-outline-secondary" href="{{ cancel_url or '/persons' }}">Скасувати</a>
        </div>
    </form>
</body>

</html>
