<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Адміністративний вхід</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4"><h1>Адміністративний вхід</h1>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
{% if enabled %}<form method="post" action="/admin/login" style="max-width:32rem">
<label for="token" class="form-label">Адміністративний токен</label>
<input id="token" name="token" type="password" class="form-control" autocomplete="off" required>
<button class="btn btn-primary mt-3">Увійти</button></form>
{% else %}<p class="alert alert-warning">Адміністрування вимкнено. Власник сервера має налаштувати адміністративний доступ.</p>{% endif %}
<a href="/persons" class="btn btn-link">До списку людей</a></body></html>
