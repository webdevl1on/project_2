{% extends 'layouts/base.html' %}
{% block title %}Створення користувача{% endblock %}
{% block workspace_class %}ui-content-narrow{% endblock %}
{% block content %}
<h1 class="h3">Створити користувача</h1>
<form method="post" action="/admin/users/new" data-account-form><input type="hidden" name="csrf" value="{{ security_csrf }}">
<label class="d-block mb-2">Логін<input name="username" class="form-control" maxlength="100" autocomplete="off" required></label>
<label class="d-block mb-2">Відображуване ім’я<input name="display_name" class="form-control" maxlength="200" required></label>
<label class="d-block mb-2">Роль<select name="role" class="form-select">{% for code,label in roles.items() %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select></label>
<label class="d-block mb-2">Пароль<input type="password" name="password" class="form-control" minlength="12" maxlength="128" autocomplete="new-password" required></label><label class="d-block mb-2">Підтвердження пароля<input type="password" name="confirm_password" class="form-control" autocomplete="new-password" required></label>
<p class="text-danger" data-account-error role="alert" hidden></p><button class="btn btn-primary">Створити</button><a class="btn btn-link" href="/admin/users">Скасувати</a></form><script src="/static/js/account_management.js"></script>
{% endblock %}
