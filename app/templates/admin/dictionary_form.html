<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Словниковий запис</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4"><h1>{{ 'Редагувати' if key else 'Додати' }} словниковий запис</h1>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ '/admin/dictionaries/' ~ key ~ '/edit' if key else '/admin/dictionaries/new' }}" class="row g-3">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="revision" value="{{ data.get('revision','') }}">
<div class="col-md-6"><label class="form-label" for="kind">Словник</label><select class="form-select" id="kind" name="kind">{% for value,label in parts.items() %}<option value="{{ value }}" {{ 'selected' if data.get('kind')==value else '' }}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="sex">Стать</label><select class="form-select" id="sex" name="sex" required><option value="">Оберіть</option>{% for value,label in sexes.items() %}<option value="{{ value }}" {{ 'selected' if data.get('sex')==value else '' }}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label" for="base_form">Основна форма</label><input class="form-control" id="base_form" name="base_form" value="{{ data.get('base_form','') }}" maxlength="100" required></div>
{% for case,label in cases.items() %}<div class="col-md-6"><label class="form-label" for="{{ case }}">{{ label }}</label><input class="form-control" id="{{ case }}" name="{{ case }}" maxlength="100" value="{{ data.get(case,'') }}" required></div>{% endfor %}
<div class="col-12 form-check ms-2"><input class="form-check-input" id="is_verified" type="checkbox" name="is_verified" {{ 'checked' if data.get('is_verified') else '' }}><label class="form-check-label" for="is_verified">Усі форми перевірено. Дозволити автоматичний підбір.</label></div>
<p>Оновлення словника не перезаписує персональні форми ПІБ.</p>
<div class="col-12"><button class="btn btn-primary">Зберегти</button> <a class="btn btn-outline-secondary" href="/admin/dictionaries?kind={{ data.get('kind','surname') }}">Скасувати</a></div></form></body></html>
