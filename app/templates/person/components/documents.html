<section data-document-panel data-person-id="{{ person_id }}">
<h2 class="h5">Документи</h2>
<div data-document-message role="status" aria-live="polite"></div>
<p data-document-auth hidden>Для перегляду документів увійдіть у вкладці «ВЛК», після чого натисніть «Оновити».</p>
<button type="button" data-document-reload class="btn btn-sm btn-outline-secondary">Оновити</button>
<div data-document-content hidden>
<button type="button" data-document-new class="btn btn-sm btn-primary">+ Новий запис</button>
<div data-document-editor hidden class="border rounded p-3 my-2">
<form data-document-form class="row g-2">
<div class="col-12"><label class="w-100">Тип документа<select name="type" class="form-select" data-document-type></select></label></div>
<p class="small text-secondary">Незаповнені реквізити можна зберегти для подальшого уточнення. Комплектність обчислюється окремо від наявності й копій.</p>
<p data-document-replacement class="alert alert-info" hidden></p>
<div data-document-fields class="row g-2"></div>
<div data-document-categories hidden><h3 class="h6">Категорії транспортних засобів</h3><div data-driving-rows></div><button type="button" data-driving-add class="btn btn-sm btn-outline-secondary">Додати категорію</button></div>
<div><button class="btn btn-primary">Зберегти</button> <button type="button" data-document-cancel class="btn btn-outline-secondary">Скасувати</button></div>
</form></div>
<label class="small my-2"><input type="checkbox" data-document-history> Показати архівні документи</label>
<div data-document-list>
<div data-document-current-list></div>
<section data-document-archive hidden aria-labelledby="document-archive-title"><hr><h3 id="document-archive-title" class="h5">Архівні документи</h3><div data-document-archive-list></div></section>
</div>
<details class="mt-3"><summary>Журнал документів</summary><div data-document-audit></div></details>
</div></section>
