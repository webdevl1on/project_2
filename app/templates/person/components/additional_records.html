<section data-additional-panel="{{ additional_kind }}" data-person-id="{{ person_id }}">
  <div data-additional-message role="alert" aria-live="polite" tabindex="-1"></div>
  <p data-additional-auth hidden>Для роботи увійдіть у вкладці «ВЛК», потім натисніть «Оновити».</p>
  <button type="button" data-additional-reload class="btn btn-sm btn-outline-secondary">Оновити</button>
  <div data-additional-content hidden>
    <button type="button" data-additional-new class="btn btn-sm btn-primary">+ Новий запис</button>
    <div data-additional-editor hidden class="border rounded my-3 p-3">
      <form data-additional-form class="row g-2">
        <div data-additional-fields class="row g-2"></div>
        <div><button class="btn btn-primary">Зберегти</button> <button type="button" data-additional-cancel class="btn btn-outline-secondary">Скасувати</button></div>
      </form>
    </div>
    <div data-additional-list class="mt-3"></div>
    <details><summary>Історія змін</summary><div data-additional-audit></div></details>
  </div>
</section>
